<!doctype html>
<html lang="en" data-smoke="running">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Unified visual parity smoke harness</title>
  <style>
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #111827; color: #e5e7eb; }
    #smokeResults { margin: 0; padding: 12px; white-space: pre-wrap; }
    iframe { position: absolute; left: -20000px; top: 0; border: 0; }
    #desktopFrame { width: 1180px; height: 900px; }
    #mobileFrame { width: 390px; height: 844px; }
  </style>
</head>
<body>
  <pre id="smokeResults">RUNNING</pre>
  <iframe id="desktopFrame" title="Desktop visual parity target"></iframe>
  <iframe id="mobileFrame" title="Mobile visual parity target"></iframe>

  <script type="module">
    const root = document.documentElement;
    const output = document.querySelector('#smokeResults');
    const desktopFrame = document.querySelector('#desktopFrame');
    const mobileFrame = document.querySelector('#mobileFrame');
    const notes = [];

    function note(message) {
      notes.push(`PASS: ${message}`);
      output.textContent = notes.join('\n');
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      note(message);
    }

    function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    async function waitFor(predicate, label, timeout = 4500) {
      const started = performance.now();
      while (performance.now() - started < timeout) {
        if (predicate()) return;
        await delay(25);
      }
      throw new Error(`timeout waiting for ${label}`);
    }

    async function load(frame, query) {
      frame.src = `./index.html?${query}`;
      await new Promise((resolve, reject) => {
        frame.addEventListener('load', resolve, { once: true });
        setTimeout(() => reject(new Error('visual iframe load timeout')), 5000);
      });
      const doc = frame.contentDocument;
      await waitFor(() => doc.querySelector('#debug')?.textContent.includes('language: en'), 'visual target runtime');
      await waitFor(() => doc.querySelectorAll('.pw-programme').length === 8, 'visual target programmes');
      return { win: frame.contentWindow, doc };
    }

    function px(value) { return Number.parseFloat(value) || 0; }

    function hasTwoGridTracks(value) {
      const tokens = String(value).trim().split(/\s+/).filter(Boolean);
      return tokens.length >= 2;
    }

    try {
      const desktop = await load(desktopFrame, 'lang=en&mode=1year&share=10&year=1990');
      const d = desktop.doc;
      const ds = desktop.win.getComputedStyle.bind(desktop.win);
      const shell = d.querySelector('.pw-shell');
      const h1 = d.querySelector('h1');
      const heroCounter = d.querySelector('.pw-hero-counter');
      const mainCounter = d.querySelector('.pw-counter-value');
      const economic = d.querySelector('.pw-economic-section');
      const scenario = d.querySelector('.pw-scenario-panel');
      const range = d.querySelector('.pw-scenario-range');
      const split = d.querySelector('.pw-opportunity-split');
      const fund = d.querySelector('.pw-opportunity-fund');

      assert(ds(shell).borderRadius === '32px', 'desktop shell keeps 32px production radius');
      assert(Math.abs(px(ds(shell).paddingLeft) - 40) < 0.5, 'desktop shell keeps 40px horizontal padding');
      assert(px(ds(h1).fontSize) >= 38, 'desktop title keeps production headline scale');
      assert(hasTwoGridTracks(ds(heroCounter).gridTemplateColumns), 'desktop hero counter keeps two-column production layout');
      assert(Math.abs(px(ds(heroCounter).paddingLeft) - 40) < 0.5, 'desktop hero counter keeps 40px padding');
      assert(ds(mainCounter).fontFamily.toLowerCase().includes('inter'), 'main counter uses production Inter number face');
      assert(Math.abs(px(ds(economic).paddingLeft) - 48) < 0.5, 'desktop content section keeps 48px production padding');
      assert(Math.abs(px(ds(scenario).paddingLeft) - 36) < 0.5, 'desktop scenario box keeps 36px horizontal padding');
      assert(Math.abs(px(ds(range).height) - 12) < 0.5, 'redistribution slider keeps 12px production track height');
      assert(hasTwoGridTracks(ds(split).gridTemplateColumns), 'desktop opportunity area keeps 1.1/0.9 split layout');
      assert(ds(fund).position === 'sticky', 'desktop opportunity fund keeps sticky production behaviour');

      const mobile = await load(mobileFrame, 'lang=en&mode=1year&share=10&year=1990');
      const m = mobile.doc;
      const ms = mobile.win.getComputedStyle.bind(mobile.win);
      const mobileShell = m.querySelector('.pw-shell');
      const mobileCounter = m.querySelector('.pw-hero-counter');
      const mobileLead = m.querySelector('.pw-lead');
      const mobileTime = m.querySelector('.pw-time-controls');
      const mobileGrid = m.querySelector('.pw-shell > .pw-reference-grid');
      const mobileProgramme = m.querySelector('.pw-programme');
      const mobileScenario = m.querySelector('.pw-scenario-panel');
      const mobileSplit = m.querySelector('.pw-opportunity-split');
      const mobileFund = m.querySelector('.pw-opportunity-fund');

      assert(ms(mobileShell).borderRadius === '0px', 'mobile shell becomes edge-to-edge');
      assert(Math.abs(px(ms(mobileShell).paddingLeft) - 16) < 0.5, 'mobile shell keeps 16px production gutter');
      assert(mobileCounter.getBoundingClientRect().top < mobileLead.getBoundingClientRect().top, 'mobile hero counter appears before long explanatory lead');
      assert(mobileLead.getBoundingClientRect().top < mobileTime.getBoundingClientRect().top, 'mobile lead appears before timeframe controls');
      assert(mobileTime.getBoundingClientRect().top < mobileGrid.getBoundingClientRect().top, 'mobile timeframe controls appear before impact cards');
      assert(Math.abs(px(ms(mobileCounter).paddingLeft) - 16) < 0.5, 'mobile hero counter keeps 16px horizontal padding');
      assert(ms(mobileScenario).backgroundColor === 'rgba(0, 0, 0, 0)', 'mobile scenario panel flattens to transparent production surface');
      assert(ms(mobileProgramme).display === 'flex', 'mobile programme row uses stacked production layout');
      assert(ms(mobileProgramme).borderRadius === '0px', 'mobile programme rows flatten instead of looking like dashboard cards');
      assert(!hasTwoGridTracks(ms(mobileSplit).gridTemplateColumns), 'mobile opportunity split collapses to one column');
      assert(ms(mobileFund).position === 'static', 'mobile opportunity fund is no longer sticky');

      root.dataset.smoke = 'pass';
      output.textContent = `${notes.join('\n')}\nPASS: visual parity smoke complete`;
    } catch (error) {
      root.dataset.smoke = 'fail';
      output.textContent = `${notes.join('\n')}\nFAIL: ${error?.stack || error}`;
      console.error(error);
    }
  </script>
</body>
</html>
