name: True Cost of War QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run baseline QA
        run: python scripts/qa.py

      - name: Validate v2 research candidate
        run: python scripts/validate_v2_candidate.py

      - name: Validate widget routes
        run: python scripts/validate_routes.py

      - name: Validate legacy formula parity
        run: python scripts/validate_legacy_formula_parity.py

      - name: Test shared calculation engine and runtime
        run: node --test tests/*.test.mjs

      - name: Build and smoke-test all external Tilda loaders
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t languages < <(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('unified/locales/manifest.json').read_text(encoding='utf-8'))
          for language in manifest['languages']:
              print(language)
          PY
          )

          printf 'Testing Tilda loaders for: %s\n' "${languages[*]}"
          for language in "${languages[@]}"; do
            echo "::group::${language}"
            python scripts/build_tilda_embed.py --lang "$language" --max-block-bytes 150000
            python scripts/build_tilda_external_loader.py --lang "$language"
            python scripts/tilda_external_browser_smoke.py --lang "$language"
            echo "::endgroup::"
          done

      - name: Split Russian Tilda embed into editor-safe T123 blocks
        run: python scripts/split_tilda_blocks.py --lang ru --max-block-bytes 42000

      - name: Smoke-test split Tilda-native Russian embed
        run: python scripts/tilda_browser_smoke.py

      - name: Upload Tilda loader package
        uses: actions/upload-artifact@v4
        with:
          name: true-cost-of-war-tilda-loaders
          path: dist/tilda
          if-no-files-found: error
          retention-days: 7

      - name: Build reproducible widget bundle
        run: python scripts/build_widget_bundle.py

      - name: Upload widget bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: true-cost-of-war-widget-bundle
          path: dist/true-cost-of-war
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated shadow runtime
        run: python scripts/build_shadow_runtime.py

      - name: Build localized visual-parity shadows
        run: python scripts/build_shadow_parity.py

      - name: Upload shadow runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: true-cost-of-war-shadow-v2
          path: dist/shadow-v2
          if-no-files-found: error
          retention-days: 7
