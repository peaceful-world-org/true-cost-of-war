name: True Cost of War QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run baseline QA
        run: python scripts/qa.py

      - name: Validate v2 research candidate
        run: python scripts/validate_v2_candidate.py

      - name: Validate widget routes
        run: python scripts/validate_routes.py

      - name: Validate legacy formula parity
        run: python scripts/validate_legacy_formula_parity.py

      - name: Test shared calculation engine and runtime
        run: node --test tests/*.test.mjs

      - name: Build reproducible widget bundle
        run: python scripts/build_widget_bundle.py

      - name: Upload widget bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: true-cost-of-war-widget-bundle
          path: dist/true-cost-of-war
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated shadow runtime
        run: python scripts/build_shadow_runtime.py

      - name: Build English visual-parity shadow
        run: python scripts/build_shadow_parity.py

      - name: Upload shadow runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: true-cost-of-war-shadow-v2
          path: dist/shadow-v2
          if-no-files-found: error
          retention-days: 7
