name: Publish Tilda loader assets

on:
  push:
    branches:
      - main
    paths:
      - 'unified/**'
      - 'src/**'
      - 'data/**'
      - 'scripts/build_tilda_embed.py'
      - 'scripts/build_tilda_external_loader.py'
      - 'scripts/tilda_external_browser_smoke.py'
      - '.github/workflows/tilda-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: true-cost-of-war-tilda-assets
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and smoke-test all language loaders
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t languages < <(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('unified/locales/manifest.json').read_text(encoding='utf-8'))
          for language in manifest['languages']:
              print(language)
          PY
          )

          printf 'Building Tilda loaders for: %s\n' "${languages[*]}"
          for language in "${languages[@]}"; do
            echo "::group::${language}"
            python scripts/build_tilda_embed.py --lang "$language" --max-block-bytes 150000
            python scripts/build_tilda_external_loader.py --lang "$language"
            python scripts/tilda_external_browser_smoke.py --lang "$language"
            echo "::endgroup::"
          done

      - name: Publish immutable loader branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir="$(mktemp -d)"
          git fetch origin tilda-dist || true
          if git show-ref --verify --quiet refs/remotes/origin/tilda-dist; then
            git worktree add "$publish_dir" origin/tilda-dist
            cd "$publish_dir"
            git switch -c tilda-dist
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git worktree add --detach "$publish_dir"
            cd "$publish_dir"
            git switch --orphan tilda-dist
            git rm -rf . || true
          fi
          cp "$GITHUB_WORKSPACE/dist/tilda/"*-loader.js ./
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          touch .nojekyll
          git add .
          git commit -m "Publish Tilda loaders for ${GITHUB_SHA}"
          git push origin HEAD:tilda-dist --force
